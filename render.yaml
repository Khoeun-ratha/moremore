services:
  - type: web
    name: moremore-backend
    runtime: docker
    plan: free
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL_CA_PATH
        value: /etc/secrets/aiven-ca.pem
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "45"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "14"
      - key: CORS_ORIGINS
        value: https://moremore-admin.onrender.com
      - key: MEDIA_ROOT
        value: media
      - key: MAX_UPLOAD_SIZE_MB
        value: "500"
      - key: PASSWORD_RESET_TOKEN_EXPIRE_MINUTES
        value: "10"
      - key: SMS_WEBHOOK_URL
        value: ""
      - key: SMS_WEBHOOK_TOKEN
        value: ""

  - type: web
    name: moremore-admin
    runtime: static
    plan: free
    buildCommand: cd admin && npm install && npm run build
    staticPublishPath: admin/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://moremore-backend.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
